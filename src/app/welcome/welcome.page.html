<ion-content [fullscreen]="true" class="welcome">
  <main class="sn-page welcome-layout">
    <p class="wordmark">Sanelle</p>

    <section class="intro">
      <h1>Diagnosed with fibroids. Understand what comes next.</h1>
      <p class="support">See what your scan report says, what it leaves out, and what to ask your doctor.</p>
    </section>

    <!-- The product explaining itself: a report's details, the gap, and the question it becomes. -->
    <figure class="example" aria-labelledby="example-title">
      <figcaption id="example-title">For example, a scan report says</figcaption>
      <dl class="example-facts">
        <div><dt>Fibroids</dt><dd>2</dd></div>
        <div><dt>Largest</dt><dd>4.1 cm</dd></div>
        <div><dt>Location</dt><dd>intramural</dd></div>
        <div><dt>FIGO type</dt><dd><span class="sn-status sn-status--unknown">Not stated</span></dd></div>
      </dl>
      <p class="example-ask"><span>So you could ask</span>“Do my fibroids have a FIGO type?”</p>
    </figure>

    <section class="actions" aria-label="Get started">
      <button type="button" class="sn-btn sn-btn--apricot" (click)="start()">Start with what you know</button>
      <button type="button" class="sn-btn sn-btn--outline-on-brand" (click)="signIn()">I already have an account</button>
      <p class="fine">Sanelle doesn’t diagnose or replace your doctor.</p>
    </section>
  </main>
</ion-content>
