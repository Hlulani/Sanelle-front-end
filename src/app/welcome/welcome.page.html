<ion-content [fullscreen]="true" class="welcome">
  <main class="sn-page welcome-layout">
    <section class="intro">
      <p class="wordmark" aria-label="Sanelle">Sanelle</p>
      <h1>Diagnosed with fibroids. Understand what comes next.</h1>
      <p class="support">Your diagnosis, food questions and appointments in one place.</p>
    </section>

    <section class="actions" aria-label="Get started">
      <button type="button" class="sn-btn sn-btn--apricot" (click)="start()">Start with what you know</button>
      <button type="button" class="sn-btn sn-btn--outline-on-brand" (click)="signIn()">I already have an account</button>
      <p class="fine">Sanelle doesn’t diagnose or replace your doctor.</p>
    </section>
  </main>
</ion-content>
