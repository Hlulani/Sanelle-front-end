<ion-content [fullscreen]="true" class="onboarding">
  <main class="sn-page wrap">
    <div class="top">
      <p class="wordmark">Sanelle</p>
    </div>

    <h1>What would you like help with?</h1>
    <p class="sub">Choose any. We’ll show these first, and you can change them in Account.</p>
    <div class="choices">
      @for (c of choices; track c.value) {
        <button type="button" class="choice" [attr.aria-pressed]="isSelected(c.value)" (click)="toggle(c.value)">
          <span class="choice-label">{{ c.label }}</span>
          <span class="choice-hint">{{ c.hint }}</span>
          <span class="tick" aria-hidden="true">{{ isSelected(c.value) ? '✓' : '' }}</span>
        </button>
      }
    </div>

    <div class="actions">
      <button type="button" class="sn-btn sn-btn--apricot" [disabled]="!selected().length" (click)="continue()">Continue</button>
      <button type="button" class="sn-btn sn-btn--outline-on-brand" (click)="skip()">Skip for now</button>
      <p class="signed-in">
        Signed in as {{ email }}
        <button type="button" class="sn-btn sn-btn--quiet log-out" (click)="logOut()">Log out</button>
      </p>
    </div>
  </main>
</ion-content>
