<div class="input-group">
  <ion-item lines="none" class="custom-input">
    <ion-icon name="mail-outline" slot="start"></ion-icon>
    <ion-input [(ngModel)]="email" name="email" type="email" placeholder="Email address"></ion-input>
  </ion-item>
  @if (emailError()) {
    <ion-text color="danger">
      <p class="field-error-text">{{ emailError() }}</p>
    </ion-text>
  }

  <ion-item lines="none" class="custom-input ion-margin-top">
    <ion-icon name="person-outline" slot="start"></ion-icon>
    <ion-input [(ngModel)]="username" name="username" type="text" placeholder="Username" autocapitalize="off"></ion-input>
  </ion-item>
  @if (usernameError()) {
    <ion-text color="danger">
      <p class="field-error-text">{{ usernameError() }}</p>
    </ion-text>
  }

  <ion-item lines="none" class="custom-input ion-margin-top">
    <ion-icon name="lock-closed-outline" slot="start"></ion-icon>

    <ion-input
      [(ngModel)]="password"
      name="password"
      [type]="isPasswordVisible() ? 'text' : 'password'"
      placeholder="Password">
    </ion-input>

    <ion-icon
      [name]="isPasswordVisible() ? 'eye-off-outline' : 'eye-outline'"
      slot="end"
      (click)="togglePasswordVisibility()"
      style="font-size: 18px; cursor: pointer; opacity: 0.8;">
    </ion-icon>
  </ion-item>


  <ion-item lines="none" class="custom-input ion-margin-top">
    <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
    <ion-input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm password"></ion-input>
  </ion-item>
</div>

@if (password) {
  <div class="strength-meter">
    <div class="meter-bars">
      @for (i of [0, 1, 2, 3, 4]; track i) {
        <div
          class="meter-bar"
          [class.filled]="i < passwordStrengthScore()"
          [ngClass]="'strength-' + passwordStrengthLabel().toLowerCase()">
        </div>
      }
    </div>
    <span class="meter-text">Password strength: <strong>{{ passwordStrengthLabel() }}</strong></span>
  </div>
}

<ion-button expand="block" (click)="submit()" [disabled]="isLoading()" class="main-submit-btn">
  @if (!isLoading()) {
    <span>Create account</span>
  }
  @if (isLoading()) {
    <ion-spinner name="crescent"></ion-spinner>
  }
</ion-button>

@if (error()) {
  <ion-text color="danger">
    <p class="error-text">{{ error() }}</p>
  </ion-text>
}
