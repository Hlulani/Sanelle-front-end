<ion-content [fullscreen]="true" class="auth-page">
  <main class="sn-page auth-layout">
    <header class="auth-head">
      <p class="wordmark">Sanelle</p>
      <h1>{{ mode() === 'register' ? 'Create your account' : 'Welcome back' }}</h1>
      <p class="sub">Your records stay on this phone.</p>
    </header>

    <section class="auth-card">
      <ion-segment [value]="mode()" (ionChange)="setMode(($event.detail.value ?? '') + '')" mode="ios">
        <ion-segment-button value="register">
          <ion-label>Register</ion-label>
        </ion-segment-button>
        <ion-segment-button value="login">
          <ion-label>Log in</ion-label>
        </ion-segment-button>
      </ion-segment>

      <div class="form-area">
        <app-register-form *ngIf="mode() === 'register'"></app-register-form>
        <app-login-form *ngIf="mode() === 'login'"></app-login-form>
      </div>
    </section>
  </main>
</ion-content>
