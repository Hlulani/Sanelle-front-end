<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Sanelle multi-day meal planner</title>
  <desc id="desc">Tabs select three days, one week, two weeks, or one month above a seven-day editable meal calendar.</desc>
  <rect width="900" height="420" fill="#FFFFFF"/>
  <text x="34" y="42" font-family="Fredoka" font-size="28" fill="#301B23">Plan enough to make the week easier</text>
  <g transform="translate(34 70)" font-family="Nunito Sans" font-size="12" font-weight="800" text-anchor="middle">
    <rect width="190" height="42" fill="#FFFFFF" stroke="#DFD1CB"/><text x="95" y="26" fill="#74636A">3 days</text>
    <rect x="190" width="190" height="42" fill="#F6E1E3" stroke="#74203F" stroke-width="2"/><text x="285" y="26" fill="#74203F">1 week</text>
    <rect x="380" width="190" height="42" fill="#FFFFFF" stroke="#DFD1CB"/><text x="475" y="26" fill="#74636A">2 weeks</text>
    <rect x="570" width="190" height="42" fill="#FFFFFF" stroke="#DFD1CB"/><text x="665" y="26" fill="#74636A">1 month</text>
  </g>
  <g transform="translate(34 138)" font-family="Nunito Sans">
    <g><rect width="108" height="190" fill="#F7F5F2" stroke="#74203F" stroke-width="2"/><text x="10" y="21" font-size="10" font-weight="800" fill="#74203F">DAY 1</text><rect x="10" y="34" width="88" height="65" fill="#F2B37E"/><text x="10" y="123" font-size="11" font-weight="800" fill="#301B23">Grain bowl</text><text x="10" y="143" font-size="9" fill="#74636A">35 min</text></g>
    <g transform="translate(118)"><rect width="108" height="190" fill="#F7F5F2" stroke="#DFD1CB"/><text x="10" y="21" font-size="10" font-weight="800" fill="#74203F">DAY 2</text><rect x="10" y="34" width="88" height="65" fill="#F6E1E3"/><text x="10" y="123" font-size="11" font-weight="800" fill="#301B23">Bean + rice</text><text x="10" y="143" font-size="9" fill="#74636A">20 min</text></g>
    <g transform="translate(236)"><rect width="108" height="190" fill="#F7F5F2" stroke="#DFD1CB"/><text x="10" y="21" font-size="10" font-weight="800" fill="#74203F">DAY 3</text><rect x="10" y="34" width="88" height="65" fill="#74203F"/><text x="10" y="123" font-size="11" font-weight="800" fill="#301B23">Spiced lentils</text><text x="10" y="143" font-size="9" fill="#74636A">40 min</text></g>
    <g transform="translate(354)"><rect width="108" height="190" fill="#FFFFFF" stroke="#DFD1CB" stroke-dasharray="5 4"/><text x="10" y="21" font-size="10" font-weight="800" fill="#74203F">DAY 4</text><text x="54" y="92" text-anchor="middle" font-size="25" fill="#74203F">+</text><text x="54" y="116" text-anchor="middle" font-size="9" fill="#74636A">Open day</text></g>
    <g transform="translate(472)"><rect width="108" height="190" fill="#F7F5F2" stroke="#DFD1CB"/><text x="10" y="21" font-size="10" font-weight="800" fill="#74203F">DAY 5</text><rect x="10" y="34" width="88" height="65" fill="#F2B37E"/><text x="10" y="123" font-size="11" font-weight="800" fill="#301B23">Grain bowl</text><text x="10" y="143" font-size="9" fill="#74636A">Leftovers</text></g>
    <g transform="translate(590)"><rect width="108" height="190" fill="#F7F5F2" stroke="#DFD1CB"/><text x="10" y="21" font-size="10" font-weight="800" fill="#74203F">DAY 6</text><rect x="10" y="34" width="88" height="65" fill="#F6E1E3"/><text x="10" y="123" font-size="11" font-weight="800" fill="#301B23">Bean + rice</text><text x="10" y="143" font-size="9" fill="#74636A">20 min</text></g>
    <g transform="translate(708)"><rect width="108" height="190" fill="#F7F5F2" stroke="#DFD1CB"/><text x="10" y="21" font-size="10" font-weight="800" fill="#74203F">DAY 7</text><rect x="10" y="34" width="88" height="65" fill="#74203F"/><text x="10" y="123" font-size="11" font-weight="800" fill="#301B23">Spiced lentils</text><text x="10" y="143" font-size="9" fill="#74636A">Prep done</text></g>
  </g>
  <rect x="34" y="350" width="816" height="43" fill="#74203F"/>
  <text x="442" y="377" text-anchor="middle" font-family="Nunito Sans" font-size="13" font-weight="800" fill="#FFFFFF">Save 7-day plan</text>
</svg>
