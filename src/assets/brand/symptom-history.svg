<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Thirty-day symptom observation window</title>
  <desc id="desc">Thirty dots show recorded bleeding categories and days without entries.</desc>
