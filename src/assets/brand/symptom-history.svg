  <text x="24" y="124" font-family="Nunito Sans, sans-serif" font-size="12" fill="#74636A">Days without a check-in are unknown, not symptom-free.</text>
  <circle cx="28" cy="151" r="5" fill="#74203F"/><text x="40" y="155" font-family="Nunito Sans, sans-serif" font-size="10" fill="#74636A">Heavy</text>
  <circle cx="103" cy="151" r="5" fill="#F2B37E"/><text x="115" y="155" font-family="Nunito Sans, sans-serif" font-size="10" fill="#74636A">Moderate</text>
  <circle cx="195" cy="151" r="5" fill="#E3DEDB"/><text x="207" y="155" font-family="Nunito Sans, sans-serif" font-size="10" fill="#74636A">No entry</text>
