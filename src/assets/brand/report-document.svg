<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
  <title id="title">Saved report details</title>
  <desc id="desc">A report page showing two fibroids, largest recorded dimensions, and three fields not recorded.</desc>
  <rect width="420" height="300" fill="#74203F"/>
  <rect x="96" y="30" width="240" height="240" fill="#FFFFFF" transform="rotate(1 216 150)"/>
  <text x="120" y="67" font-family="Nunito Sans, sans-serif" font-weight="800" font-size="13" fill="#74203F">ULTRASOUND REPORT</text>
  <rect x="120" y="78" width="190" height="3" fill="#74203F"/>
  <rect x="120" y="99" width="170" height="6" fill="#E8E1DD"/>
  <rect x="120" y="114" width="125" height="6" fill="#E8E1DD"/>
  <text x="120" y="151" font-family="Nunito Sans, sans-serif" font-size="10" fill="#74636A">NUMBER</text>
  <text x="120" y="175" font-family="Fredoka, sans-serif" font-size="26" fill="#74203F">2</text>
  <text x="226" y="151" font-family="Nunito Sans, sans-serif" font-size="10" fill="#74636A">LARGEST RECORDED</text>
