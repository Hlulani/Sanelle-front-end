    .dots{display:flex;gap:4px;overflow:hidden;margin:17px 0}.dots i{width:8px;height:8px;border-radius:50%;background:#dfdbd8;flex:none}.dots i:nth-child(4n){background:var(--berry)}.dots i:nth-child(7n){background:var(--apricot)}.stat{background:var(--off);padding:14px;margin:11px 0}.stat strong{display:block;font-family:"Fredoka";font-size:1.2rem;color:var(--berry)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:var(--off);padding:11px;min-height:85px}.card b{display:block;font-size:.65rem}.card span{color:var(--muted);font-size:.53rem}
    .calendar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}.day{border:1px solid var(--line);padding:6px;min-height:86px;font-size:.51rem}.day img{width:100%;height:42px;object-fit:cover;margin:4px 0}.day b{display:block;font-size:.52rem}.day.open{display:grid;place-items:center;color:var(--berry);border-style:dashed}.nav{position:absolute;bottom:0;left:0;right:0;height:61px;background:white;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;color:var(--muted);font-size:.5rem}.nav b{color:var(--berry)}
    .annotation{max-width:680px}.annotation .id{color:var(--berry);font-size:.75rem;letter-spacing:.12em;font-weight:800}.annotation h1{font-size:3rem;line-height:1;margin:8px 0 14px}.annotation .purpose{color:var(--muted);font-size:1rem;max-width:580px}.links{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.links span{background:white;border:1px solid var(--line);padding:8px 10px;font-size:.67rem}.links b{color:var(--berry)}.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{background:white;border-top:3px solid var(--berry);padding:15px}.note strong{font-size:.68rem;color:var(--berry);text-transform:uppercase;letter-spacing:.07em}.note p{font-size:.72rem;color:var(--muted);margin-bottom:0}.internal .phone{width:620px;height:680px;border-radius:8px}.internal{grid-template-columns:640px 1fr}.internal .phone-body{padding-bottom:0}.catalogbar{background:var(--dark);color:#fff;padding:18px}.table{margin:14px}.table .row{grid-template-columns:2fr 1fr 1fr 1fr}.status{color:var(--green);font-weight:800}
    @media(max-width:900px){.index-grid{grid-template-columns:1fr 1fr}.screen-page,.internal{grid-template-columns:1fr;justify-items:center}.annotation{max-width:620px}.internal .phone{width:min(620px,95vw)}}

  </style>

      if(g==="Onboarding")return onboardingContent(id,t);
      if(g==="Today")return `<div class="body"><span class="eyebrow">${id}</span><h2>Good morning, Thandi</h2><div class="berry-hero"><span class="eyebrow" style="color:#f2b37e">Your next step</span><h3>${t}</h3><p>Continue the most useful unfinished action.</p><button class="button secondary">Continue →</button></div><div class="rows"><div class="row"><b>Report added</b><span>Needs checking</span></div><div class="row"><b>Check-in saved</b><span>Yesterday</span></div><div class="row"><b>Meal plan saved</b><span>7 days</span></div></div></div>`;
      if(g==="Report")return `<div class="body"><span class="eyebrow">${id}</span><h2>${t}</h2><p>Original wording and units stay visible until the user confirms transcription.</p><div class="doc"><h3>ULTRASOUND REPORT</h3><div class="line"></div><div class="line short"></div><div class="rows"><div class="row"><span>Number</span><b>2</b></div><div class="row"><span>Largest dimensions</span><b>41 × 38 × 35 mm</b></div><div class="row"><span>Location</span><b>Not recorded</b></div></div></div><button class="button">${id==="RPT-03"?"Save checked details":"Continue"}</button></div>`;
      if(g==="My health")return `<div class="body"><span class="eyebrow">${id}</span><h2>${t}</h2><div class="doc"><h3>Saved report</h3><div class="row"><span>2 fibroids</span><b>Checked</b></div><div class="row"><span>Location</span><b>Not recorded</b></div></div><div class="stat"><strong>What does this mean?</strong><p>Your saved report does not include a location. Sanelle will not infer it.</p></div><button class="button">Add a question for my next visit</button></div>`;
      if(g==="Symptoms")return `<div class="body"><span class="eyebrow">${id}</span><h2>${t}</h2><p>Personal history · missing days remain unknown.</p><div class="dots">${Array.from({length:30},()=>"<i></i>").join("")}</div><div class="stat"><strong>8 of 30 days</strong><span>recorded in this window</span></div><div class="cards"><div class="card"><b>Heavy bleeding</b><span>3 recorded answers</span></div><div class="card"><b>Daily impact</b><span>Changed plans twice</span></div></div><button class="button">Log today</button></div>`;
      if(g==="Food")return foodContent(id,t);
      if(g==="Appointment")return `<div class="body"><img class="photo" src="${notes}" alt=""><span class="eyebrow">${id}</span><h2>${t}</h2><div class="doc"><h3>Appointment summary</h3><div class="row"><span>Recorded diagnosis</span><b>2 fibroids</b></div><div class="row"><span>Recent symptoms</span><b>Heavy bleeding</b></div><div class="row"><span>Question 1</span><b>Open</b></div></div><div class="field"><label>Answer or next step</label><div class="input">Save in your own words</div></div><button class="button">Save</button></div>`;return ""}
    function onboardingContent(id,t){const base=`<div class="body"><img class="photo" src="${id.startsWith("ONB-01")?read:notes}" alt="">`;if(id.startsWith("ONB-01"))return `${base}<span class="eyebrow">${id} · Step 1 of 5</span><h2>${t}</h2><p>What should Sanelle call you?</p><div class="field"><label>First name</label><div class="input">${id==="ONB-01E"?"Your first name":"Thandi"}</div></div>${id==="ONB-01D"?`<div class="stat"><strong>Demo details loaded</strong><span>2 fibroids · largest 4.1 cm · 3 details not recorded</span></div>`:""}<button class="button">Continue</button><button class="button secondary">Preview Thandi demo</button></div>`;if(id.startsWith("ONB-02"))return `${base}<span class="eyebrow">${id} · Step 2 of 5</span><h2>${t}</h2><p>Choose any that matter now. All are optional.</p>${["Understand my diagnosis","Make food feel simpler","Track symptoms","Prepare for appointments"].map((x,i)=>`<div class="choice ${id!=="ONB-02E"&&i<2?"selected":""}"><i></i>${x}</div>`).join("")}<button class="button">Continue</button></div>`;if(id.startsWith("ONB-03"))return `${base}<span class="eyebrow">${id} · Step 3 of 5</span><h2>${t}</h2><p>Add only what is recorded. Leave anything blank if unsure.</p><div class="field"><label>Number of fibroids · Optional</label><div class="input">${id==="ONB-03E"?"Not recorded":"2"}</div></div><div class="field"><label>Largest recorded size · Optional</label><div class="input">${id==="ONB-03E"?"Not recorded":"4.1 cm"}</div></div><div class="stat"><strong>Details to look for later</strong><span>Location, FIGO type and cavity involvement</span></div><button class="button">Continue</button></div>`;if(id.startsWith("ONB-04"))return `${base}<span class="eyebrow">${id} · Step 4 of 5</span><h2>${t}</h2><p>Optional context can make check-ins and meal planning more relevant.</p><span class="eyebrow">Symptoms to track</span>${["Bleeding","Pain or cramping","Pelvic pressure","Low energy"].map((x,i)=>`<div class="choice ${id!=="ONB-04E"&&i<2?"selected":""}"><i></i>${x}</div>`).join("")}<span class="eyebrow">Food planning</span><div class="cards"><div class="card"><b>Quick meals</b></div><div class="card"><b>Ingredient swaps</b></div></div><button class="button">Continue</button></div>`;if(id.startsWith("ONB-05"))return `${base}<span class="eyebrow">${id} · Step 5 of 5</span><h2>${t}</h2><p>Add a date only if you want help preparing.</p><div class="field"><label>Appointment date · Optional</label><div class="input">${id==="ONB-05E"?"No date added":"24 October 2026"}</div></div><button class="button">Finish setup</button><button class="button secondary">I don't have a date</button></div>`;return `${base}<span class="eyebrow">${id} · Ready to start</span><h2>${t}</h2><p>Review what Sanelle will organise first.</p><div class="rows"><div class="row"><span>Priorities</span><b>Diagnosis · Food</b></div><div class="row"><span>Recorded diagnosis</span><b>2 fibroids</b></div><div class="row"><span>Appointment</span><b>No date</b></div></div><button class="button">Open Sanelle</button></div>`}
    function foodContent(id,t){if(id==="FOOD-03")return `<div class="body"><span class="eyebrow">${id}</span><h2>${t}</h2><div class="cards"><div class="card"><b>3 days</b></div><div class="card"><b>1 week</b></div><div class="card"><b>2 weeks</b></div><div class="card"><b>1 month</b></div></div><div class="calendar">${Array.from({length:6},(_,i)=>`<div class="day ${i===3?"open":""}">${i===3?"+ Open":`Day ${i+1}<img src="${img}"><b>Grain bowl</b>`}</div>`).join("")}</div><button class="button">Save plan</button></div>`;
      if(id==="FOOD-03A")return `<div class="body"><span class="eyebrow">${id}</span><h2>Swap with a meal you prefer</h2><p>Favourites and compatible preference matches appear first.</p>${["Favourite · Bean and rice bowl","Planned before · Spiced lentils","Preference match · Grain bowl"].map((x,i)=>`<div class="choice ${i===0?"selected":""}"><i></i>${x}</div>`).join("")}<button class="button">Choose replacement</button></div>`;
      if(id==="FOOD-03B")return `<div class="body"><span class="eyebrow">${id}</span><h2>What should this swap change?</h2>${["This day only","Every occurrence this week","Every occurrence in this plan"].map((x,i)=>`<div class="choice ${i===0?"selected":""}"><i></i>${x}</div>`).join("")}<button class="button">Review grocery changes</button></div>`;
      if(id==="FOOD-03C")return `<div class="body"><span class="eyebrow">${id}</span><h2>Shopping list changes</h2><div class="rows"><div class="row"><span>Added</span><b>Tofu, spring onions</b></div><div class="row"><span>Removed</span><b>Pearl couscous</b></div><div class="row"><span>Still needed</span><b>Mixed vegetables</b></div></div><button class="button">Confirm swap</button></div>`;
      return `<div class="body"><img class="photo" src="${img}" alt=""><span class="eyebrow">${id}</span><h2>${t}</h2><p>Preferences rank eligible meals. Strict exclusions always take priority.</p><div class="rows"><div class="row"><span>Strict exclusions</span><b>None saved</b></div><div class="row"><span>Preference</span><b>Quick meals</b></div><div class="row"><span>Cooking rhythm</span><b>3 times weekly</b></div></div><button class="button">Continue</button></div>`}
    function output(id){if(id.startsWith("RPT"))return"Confirmed source details or a visible unfinished-review state.";if(id.startsWith("SYM"))return"A dated personal observation, coverage summary, or exact reported result.";if(id.startsWith("FOOD"))return"An eligible meal choice, editable plan, or updated weekly shopping list.";if(id.startsWith("APT"))return"A saved question, answer, unresolved status, or follow-up step.";return"A clear saved state that determines the next screen."}
    function boundary(id,g){if(g==="Food")return"Strict exclusions override preferences. Planning or preparation never implies consumption or fibroid effect.";if(g==="Symptoms")return"Missing days remain unknown. Categories are not converted to volume or diagnosis.";if(g==="Report"||g==="My health")return"Original wording and units are preserved. Missing findings are never inferred.";if(g==="Internal evidence")return"Only Published entries may supply patient explanations.";return"Request only information required for the visible user outcome."}
  </script>
</body>
</html>
