name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:ci
      - name: Production build
        run: npm run build
        env:
          # No production backend is deployed yet; .invalid never resolves, so nothing real is targeted.
          SANELLE_API_ORIGIN: https://api.sanelle.invalid

  e2e:
    name: End-to-end (Playwright, real backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sanelle
          POSTGRES_USER: sanelle
          POSTGRES_PASSWORD: sanelle
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanelle -d sanelle"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Hlulani/sanelle-back-end
          path: sanelle-back-end
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: sanelle-back-end/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install WebKit for Playwright
        run: npx playwright install --with-deps webkit
      - name: Compile the backend (so the e2e server starts quickly)
        working-directory: sanelle-back-end
        run: ./mvnw -B -q -DskipTests compile
      - name: End-to-end tests
        run: npm run e2e
        env:
          CI: 'true'
          SANELLE_BACKEND_DIR: ${{ github.workspace }}/sanelle-back-end
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/.output/report
            e2e/.output/results
          retention-days: 7
